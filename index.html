<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ice Flame Perfumerie</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #161616;
      --accent-color: #d4af37;
      --text-color: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 80px;
    }

    header {
      text-align: center;
      padding: 30px 20px 10px;
      background: linear-gradient(180deg, #1a1a1a 0%, var(--bg-color) 100%);
    }

    h1 {
      color: var(--accent-color);
      font-size: 2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 5px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 15px;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 20px 0;
    }

    .cat-btn {
      background: transparent;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
    }

    .search-box {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 25px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--accent-color);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 15px;
    }

    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .card-body {
      padding: 15px;
      text-align: center;
      width: 100%;
    }

    .card-title {
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 5px;
    }

    .card-cat {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      border: 1px solid var(--border-color);
      padding: 2px 8px;
      border-radius: 10px;
      display: inline-block;
      margin-bottom: 10px;
    }

    .card-price {
      font-size: 1.3rem;
      color: var(--accent-color);
      font-weight: bold;
      margin-bottom: 15px;
    }

    .btn-buy {
      display: inline-block;
      width: 90%;
      padding: 10px;
      background: var(--accent-color);
      color: #000;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    .whatsapp-float {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #25d366;
      color: white;
      padding: 12px 20px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      font-size: 0.9rem;
    }

    .empty {
      text-align: center;
      color: var(--text-muted);
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Ice Flame</h1>
    <p class="subtitle">NUESTRO CATÁLOGO</p>
    <p class="subtitle" style="font-size: 0.8rem; margin-top: 3px;">Encuentra el aroma que te representa.</p>
  </header>

  <div class="container">
    <div class="categories">
      <button class="cat-btn active" onclick="filterCat('Todos', this)">TODOS</button>
      <button class="cat-btn" onclick="filterCat('Hombre', this)">HOMBRE</button>
      <button class="cat-btn" onclick="filterCat('Mujer', this)">MUJER</button>
      <button class="cat-btn" onclick="filterCat('Árabes', this)">ÁRABES</button>
      <button class="cat-btn" onclick="filterCat('Unisex', this)">UNISEX</button>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="Buscar perfume..." oninput="render()">

    <div id="productGrid" class="grid"></div>
  </div>

  <a href="https://wa.me/5355773567" class="whatsapp-float" target="_blank">WHATSAPP</a>

  <script>
    const perfumes = [
      {
        name: "Hawas",
        price: 50,
        cat: "Árabes",
        image: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "Pacific Aura",
        price: 45,
        cat: "Árabes",
        image: "https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "Nitro Elixir",
        price: 55,
        cat: "Árabes",
        image: "https://images.unsplash.com/photo-1547887537-6158d64c35b3?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "Kobra",
        price: 65,
        cat: "Árabes",
        image: "https://images.unsplash.com/photo-1588405748880-12d1d2a59f75?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "9PM",
        price: 65,
        cat: "Árabes",
        image: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "Liquid Brun",
        price: 65,
        cat: "Árabes",
        image: "https://images.unsplash.com/photo-1615397349754-cfa2066a298e?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "Wraith Spectre",
        price: 70,
        cat: "Árabes",
        image: "https://images.unsplash.com/photo-1528729482771-6f07b5d72fcf?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "Momento Riffs",
        price: 70,
        cat: "Árabes",
        image: "https://images.unsplash.com/photo-1557170334-a9632e77c6e4?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "Tom Ford Ombré Leather",
        price: null,
        cat: "Hombre",
        image: "https://images.unsplash.com/photo-1616949755610-8c9bbc08f138?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "Dior Homme Intense",
        price: null,
        cat: "Hombre",
        image: "https://images.unsplash.com/photo-1595425970377-c9703cf48b6d?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "Bleu de Chanel EDP",
        price: null,
        cat: "Hombre",
        image: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "SpiceBomb Extreme",
        price: null,
        cat: "Hombre",
        image: "https://images.unsplash.com/photo-1541643600914-78b084683601?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "Versace Eros Flame",
        price: null,
        cat: "Hombre",
        image: "https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "Invictus Elixir",
        price: null,
        cat: "Hombre",
        image: "https://images.unsplash.com/photo-1588405748880-12d1d2a59f75?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "YSL Libre Intense",
        price: null,
        cat: "Mujer",
        image: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "Black Opium YSL",
        price: null,
        cat: "Mujer",
        image: "https://images.unsplash.com/photo-1557170334-a9632e77c6e4?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "Mon Paris YSL",
        price: null,
        cat: "Mujer",
        image: "https://images.unsplash.com/photo-1547887537-6158d64c35b3?auto=format&fit=crop&w=600&q=80"
      },
      {
        name: "Louis Vuitton Imagination",
        price: null,
        cat: "Unisex",
        image: "https://images.unsplash.com/photo-1615397349754-cfa2066a298e?auto=format&fit=crop&w=600&q=80"
      }
    ];

    let currentCategory = "Todos";

    function filterCat(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function render() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const container = document.getElementById("productGrid");
      
      const filtered = perfumes.filter(p => {
        const matchesCat = currentCategory === "Todos" || p.cat === currentCategory;
        const matchesSearch = p.name.toLowerCase().includes(search);
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<p class="empty">Próximamente más catálogo disponible.</p>';
        return;
      }

      container.innerHTML = filtered.map(p => `
        <div class="card">
          <img src="${p.image}" alt="${p.name}">
          <div class="card-body">
            <h3 class="card-title">${p.name}</h3>
            <span class="card-cat">${p.cat}</span>
            <div class="card-price">${p.price ? '$' + p.price : 'Consultar'}</div>
            <a href="https://wa.me/5355773567?text=Hola,%20deseo%20consultar%20sobre%20el%20perfume%20${encodeURIComponent(p.name)}" class="btn-buy" target="_blank">CONSULTAR / COMPRAR</a>
          </div>
        </div>
      `).join('');
    }

    render();
  </script>
</body>
</html>
